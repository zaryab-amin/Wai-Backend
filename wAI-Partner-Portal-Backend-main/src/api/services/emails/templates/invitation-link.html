<div>
  <p>Dear {{user.name}},</p>
  <br />
  <p>
    You have been invited to join <strong>IAE</strong>. Please click the link
    below to accept the invitation and complete your registration:
  </p>
  <div style="text-align: center; margin: 30px 0">
    <a
      href="{{inviteUrl}}"
      style="
        display: inline-block;
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 5px;
      "
      >Accept Invitation</a
    >
  </div>
  <br />
  <p>If you did not expect this invitation, please ignore this email.</p>
  <br />
  <p>Best regards,</p>
  <p>IAE Team</p>
</div>
